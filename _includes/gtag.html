{% if site.gtag %}

{% if jekyll.environment == 'production' %}

<!-- Add cookie consent css & js -->
<link rel="stylesheet"
    type="text/css"
    href="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.js"
    data-cfasync="false"></script>

<!-- Add google analytics (Consent Mode v2: everything denied until the visitor approves) -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }

  // Reads the value of a cookie by name or returns empty string
  function getCookie(name) {
    var b = document.cookie.match('(^|[^;]+)\\s*' + name + '\\s*=\\s*([^;]+)');
    return b ? b.pop() : '';
  }

  // Tells Google whether the visitor has granted or denied consent
  function updateConsent(status) {
    var value = status === 'allow' ? 'granted' : 'denied';
    gtag('consent', 'update', {
      'ad_user_data': value,
      'ad_personalization': value,
      'ad_storage': value,
      'analytics_storage': value
    });
  }

  // Default to denied; wait briefly so a stored choice can be applied before the first hit
  gtag('consent', 'default', {
    'ad_user_data': 'denied',
    'ad_personalization': 'denied',
    'ad_storage': 'denied',
    'analytics_storage': 'denied',
    'wait_for_update': 500
  });

  // Apply a previously stored choice immediately
  if (getCookie('cookieconsent_status') === 'allow') {
    updateConsent('allow');
  }

  gtag('js', new Date());
  gtag('config', '{{ site.gtag }}');
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.gtag }}"></script>
<script>
  window.addEventListener("load", function () {
    // Initialise cookie consent banner
    window.cookieconsent.initialise({
      "palette": {
        "popup": {
          "background": "#efefef",
          "text": "#404040"
        },
        "button": {
          "background": "#8ec760",
          "text": "#ffffff"
        }
      },
      "type": "opt-in",
      "content": {
        "allow": "Approve",
        "deny": "Reject"
      },
      // Update Google consent as soon as the visitor chooses; no reload needed
      onStatusChange: function (status) {
        updateConsent(status);
      }
    });
  });
</script>

{% endif %}  
{% endif %}
