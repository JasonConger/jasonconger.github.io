# Videos listed on /videos/. Newest first. Each links to YouTube; `post:` adds a link to the written post.
- id: XgJHJqlpmSw
  title: "Patching at Negative Two Days: VulnOps in the AI Era"
  date: 2026-11-06
  duration: "5:54"
  description: "At Cisco Partner Summit, Jason Conger talks with Dre Garrison of Cisco about the Partner VulnOps Practice Maturity Model, a five-level framework that helps partners grow their vulnerability operations practice as frontier AI models shrink the time to patch. Dre explains the five-question self-assessment, the best practices and tools recommended at each level, and how Antares, Cisco's free open-weight small language model, scans configuration files from any vendor for vulnerabilities.\n\nGuests:\n- Jason Conger, Splunk Partner Field CTO\n- Dre Garrison, Solutions Engineer, Cisco\n\nChapters:\n0:00 Intro\n0:12 Why a VulnOps maturity model\n0:57 The five-question self-assessment\n1:05 From months to negative two days\n2:08 How to move up a level\n3:26 Antares, a free small language model\n4:18 Pro tip: build a UI in 30 minutes\n4:52 Where to learn more\n\n#CiscoPartnerSummit #Splunk #Cisco #VulnerabilityManagement #CyberSecurity"
- id: 75G-r5blg-o
  title: "How Splunk and Cisco Stop an MFA Phishing Attack"
  date: 2026-11-06
  duration: "4:28"
  description: "At Cisco Partner Summit, Jason Conger talks with Gino Corleto of Cisco about a demo of a real-world attack: a phished password and an approved MFA push let a hacker into the network and down the production line. Gino explains how Duo Proximity Verification stops the login at the device, and how firewalls, Secure Network Analytics and Cyber Vision feed Splunk and Cloud Control to isolate the user, reset passwords and revoke sessions in minutes, automatically if you want.\n\nGuests:\n- Jason Conger, Splunk Partner Field CTO\n- Gino Corleto, Industry Solutions Architect, Cisco\n\nChapters:\n0:00 Intro: the fake IT call\n0:28 How the attack happened\n1:14 8 to 14 days to find a breach\n1:25 Duo Proximity Verification\n1:59 Spotting east-west movement with Splunk\n2:23 Remediating in minutes with Cloud Control\n2:58 Recap\n3:33 Automated response flows\n3:47 Where to learn more\n\n#CiscoPartnerSummit #Splunk #Cisco #CyberSecurity #MFA"
- id: BNG0BhoTId4
  title: "Patch Network Vulnerabilities with No Reboot | Cisco"
  date: 2026-11-05
  duration: "2:40"
  description: "At Cisco Partner Summit, Jason Conger talks with Tyson Scott of Cisco about Cisco Live Protect, which delivers zero-day vulnerability protection by deploying shields to Cisco switches and routers. Tyson explains how customers can mitigate a newly announced vulnerability in minutes, with a small configuration and no reboot, software update or patch, instead of waiting months for upgrade windows.\n\nGuests:\n- Jason Conger, Splunk Partner Field CTO\n- Tyson Scott, Technical Solutions Architect, Cisco\n\nChapters:\n0:00 Intro\n0:16 What is Cisco Live Protect?\n0:48 Protection the day a PSIRT is announced\n1:31 No downtime, no reboot\n2:00 Where to learn more\n\n#CiscoPartnerSummit #Splunk #Cisco #CyberSecurity #DataCenter"
- id: 73VsdMm1W18
  title: "How to Secure the AI-Ready Data Center | Cisco"
  date: 2026-11-04
  duration: "4:42"
  description: "At Cisco Partner Summit, Jason Conger talks with Jerry Lin of Cisco about layering security into the AI-ready data center. Jerry covers three areas: protecting east-west traffic with modern firewalls, the Encrypted Visibility Engine, and Nexus smart switches that enforce segmentation at the switch; securing AI applications with AI Defense, including model validation and custom guardrails; and infrastructure resilience. He also points to where partners and customers can find more information and hands-on labs.\n\nGuests:\n- Jason Conger, Splunk Partner Field CTO\n- Jerry Lin, Global Principal Security Architect, Cisco\n\nChapters:\n0:00 Intro\n0:20 Security for the AI-ready data center\n0:41 Firewalls and the Encrypted Visibility Engine\n1:15 Segmentation with Nexus smart switches\n2:13 Securing AI apps with AI Defense\n3:00 Custom guardrails\n3:36 Infrastructure resilience\n4:08 Where to learn more\n\n#CiscoPartnerSummit #Splunk #Cisco #AISecurity #DataCenter"
- id: Lsdd7YqFrK4
  title: "How Telcos Can Reinvent Themselves for AI | Splunk"
  date: 2026-11-03
  duration: "2:47"
  description: "At Splunk's Data Strategy Workshop for partners in Singapore, Jason Conger talks with Albert Kurnia of Cisco about how telcos are trying to reinvent themselves as AI opens up new opportunities. Albert explains why telco partners need to understand data and the \"why\" behind AI, which executives they should be talking to, and why proving measurable ROI and changing how they sell matters.\n\nGuests:\n- Jason Conger, Splunk Partner Field CTO\n- Albert Kurnia, Partner Account Executive, Cisco\n\nChapters:\n0:00 Intro\n0:12 What telco reinvention means\n0:48 Why understanding data comes first\n1:32 Where should a telco start?\n1:45 Talk to the CIOs, CISOs and CEOs\n2:20 Measurable ROI and a new way to sell\n\n#Splunk #Cisco #DataStrategy #Telco #SplunkPartners"
- id: DD5DU64oB18
  title: "Why Brakes Let You Go Faster: AI Safety | Splunk"
  date: 2026-10-29
  duration: "4:12"
  description: "At Splunk's Data Strategy Workshop for partners in Singapore, Jason Conger talks with CJ Low, Field CTO at Splunk, about balancing speed and safety with AI. Using a car analogy, CJ explains why guardrails aren't an inhibitor, how safety mechanisms build the trust that lets businesses move faster and take more risk, and how automated controls help safety keep up with the speed of change.\n\nGuests:\n- Jason Conger, Splunk Partner Field CTO\n- CJ Low, Field CTO, Splunk\n\nChapters:\n0:00 Intro\n0:20 Speed vs. safety: the car analogy\n1:08 Rebalancing toward safety\n1:27 Afraid to go fast without guardrails\n2:08 Brakes, not engines\n2:57 The paradox of safety\n3:08 Where to learn more\n\n#Splunk #AI #DataStrategy #AIGovernance #SplunkPartners"
- id: ViToZsrKE78
