  date: 2026-10-27
  duration: "2:41"
  description: "At Splunk's Data Strategy Workshop for partners in Singapore, Jason Conger talks with Savitalaxmi Vishwanathan about monitoring AI applications once they're live. Savita explains why AI apps need a different kind of observability (agent behavior, end-to-end user interactions, tokenomics and guardrails), how 30+ out-of-the-box evaluators and LLM support handle evaluation, and how the Luna small language model saves cost and resources.\n\nGuests:\n- Jason Conger, Splunk Partner Field CTO\n- Savitalaxmi Vishwanathan, Global Partner Technical Manager, Splunk\n\nChapters:\n0:00 Intro\n0:17 Cisco Data Fabric workshops across APJC\n0:35 How do you monitor live AI applications?\n0:57 Agents, tokenomics and guardrails\n1:12 How agent observability evaluates AI\n1:44 Luna: from LLM to SLM\n2:10 Agent Observability workshops coming next\n\n#Splunk #AgentObservability #AI #DataStrategy #SplunkPartners"
