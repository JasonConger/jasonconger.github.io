  description: "From Splunk's Data Strategy Workshop in Singapore, Jason Conger talks with Amit Harjani about bringing a new kind of partner workshop to APJC. Amit explains why the two-day format is about activating partners rather than just enabling them, how partners apply what they learn to real customer scenarios, and which workshops are coming next, including Agent Observability and Agentic SOC.\n\nGuests:\n- Jason Conger, Splunk Partner Field CTO\n- Amit Harjani, Head of Global Partner Solution Engineering, Splunk\n\nChapters:\n0:00 Intro\n0:15 First time in APJC: Tokyo and Singapore\n0:33 Activate, not enable\n0:51 Hands-on sessions on real customer scenarios\n1:32 Partners building their plans right now\n1:54 What's next: Agent Observability and Agentic SOC\n\n#Splunk #DataStrategy #SplunkPartners #APJC"
- id: ylNoyy328GM
  title: "Splunk's 3 Pillars of Data Value: Cisco Data Fabric"
  date: 2026-10-19
  duration: "3:41"
  description: "Live from Splunk's first Data Strategy Workshop for partners in Tokyo, I talk with Trav \"T-Rex\" Kane about why a data strategy matters as AI drives data growth. Trav walks through his three pillars of data value realization (streaming, landing, and analyzing data) and the Splunk technologies behind each one, from Ingest Processor and Edge Processor to Machine Data Lake and the new analytics tier. He also explains where to learn more about the Cisco Data Fabric.\n\nGuests:\n- Jason Conger, Splunk Partner Field CTO\n- Trav Kane, Leader of Partner Solutions Engineering APJC, Splunk\n\nChapters:\n0:00 Intro\n0:15 Why data strategy matters\n1:12 The T-Rex three pillars of data value\n2:07 Data streaming technologies\n2:31 Machine Data Lake and the analytics tier\n2:57 Where to learn more about Cisco Data Fabric\n\n#Splunk #CiscoDataFabric #DataStrategy #SplunkPartners"
- id: 3aRzl6JUkG8
  title: "The $937B AI Services Opportunity for GSIs, with Splunk"
  date: 2026-10-01
  duration: "3:31"
  description: "The services opportunity analysts see from 2026 to 2031 is mind boggling, and it is mostly around AI (of course it is  🙃 ). And according to Ram Krishnamurthy, GSIs are just scratching the surface.\n\nAt .conf26, I had a chat with Ram who leads our work with Global System Integrators. His take on where the innovation is happening:\n\n 1️⃣ Data is the foundation for AI. Cisco Data Fabric, built on the Splunk platform, gives GSIs a huge opportunity to help customers activate their data for AI\n\n 2️⃣ Trusted AI. Across SecOps and observability, making sure AI behaves properly and isn't hallucinating.\n\n 3️⃣ Next up: physical AI. It extends the opportunity beyond software AI.\n\nCustomers are asking their partners to do more with less, so its an exciting time to be part of this journey. Watch the full conversation."
- id: 1pBipxVXtR4
  title: "Live F1 Telemetry in Splunk, with Dashboards Built by AI"
  date: 2026-10-01
  duration: "7:48"
  description: "\"I haven't touched a line of code building any of these.\" - Robert Castley, on every dashboard at the Data Drivers F1 booth.\n\nAt .conf26 I got a behind-the-scenes tour from Robert Castley about the racing rigs streaming live telemetry into Splunk.\n\nA few highlights:\n🔹 Telemetry leaves the rig, goes to a collector in AWS, then into Splunk, and back onto the expo hall booth screens incredibly fast.\n🔹 Speed, RPM, G-force, energy recovery, a live track map and throttle/brake traces, all built with Splunk's custom visualizations framework.\n🔹 Robert describes the visualization he wants, and his skill builds it, with a local test harness so he can check it before packaging it into a Splunk app.\n🔹 After attendees complete their laps, players compare against a benchmark lap to see exactly where they brake too early or accelerate too late. There are plenty of repeat visitors.\n\nWant to build your own? Start with the Splunk skills and/or Robert's custom visualizations repo.\n\nSplunk Agent Skills: https://splunkbase.splunk.com/skills\n\nRobert Castley's custom visualizations: https://github.com/rcastley/splunk-custom-visualizations"
- id: QdIIlG5Y4lU
  title: "Free Splunk Training: Keep Learning After .conf26"
  date: 2026-10-01
  duration: "2:53"
  description: "The busiest spot on the .conf26 floor? The hands-on labs.\n\nI finally caught up with Melanie Gudesblatt, PhD (Global Enablement Program Manager, Cisco). We worked together for years at Splunk doing webinars, and now she's helping thousands of people actually get their hands on the keyboard.\n\nAt the conference, people were lining up to try whats new like Agentic SOC and Exposure Analytics. But, the learning didn't stop when .conf26 ended.  STEP, the Splunk enablement portal, has free e-learnings for beginners (search optimization, dashboards, SPL2 basics), deeper courses for seasoned pros, and certification paths.\n\nIf you missed the labs, the learning is still waiting for you at education.splunk.com"
- id: OUPtusJmhhg
  title: "Claude Code + Splunk MCP Found Hidden Home Energy Waste"
  date: 2026-10-01
  duration: "4:50"
  description: "What happens when you point Claude Code to a Splunk index (via the Splunk MCP server) that has data about your house? You find out your TV is waking up in the middle of the night.\n\nAt .conf26 I caught up with Simon Ric - Hansen after his incredible demo. He brought his home energy data into Splunk, connected Claude Code through the Splunk MCP server, and simply asked it to do energy analytics.\n\n * The MCP server discovered the data on its own and came back with a report. Simon didn't write any searches up front.\n\n* Splunk's skills, plus Robert Castley's custom visualizations repo, turned that report into a real Splunk dashboard.\n\n* As a result, it caught ghost usage from a frame TV turning itself on overnight, and loft windows opened while the heating fought against them. Now it alerts on a sudden temperature drop, so the heat doesn't kick on for an open window.\n\nIt's a personal use case, but an enterprise-grade pattern.\n\nSplunk Agent Skills: https://splunkbase.splunk.com/skills\n\nRobert Castleys custom visualizations: https://github.com/rcastley/splunk-custom-visualizations"
- id: 0zJRW92hYlA
  title: "Ciroos and Splunk - Meet Your New AI SRE Teammate"
  date: 2026-09-25
  duration: "4:12"
  description: "While at .conf26, I had an opportunity to chat with Ronak Desai and Niall Murphy from Ciroos as well as get a demo of their product.\n\nCiroos builds AI that helps operations teams cut through the noise by harnessing AI agents. One of the things that stood out to me was how they talk about their product as an SRE teammate rather than another AI tool. It was a deliberate choice of words that carries through their website and media.\n\nThe platform orchestrates multiple agents to investigate, triage, report, and recommend. It is taking the disparate signals scattered across a production environment and knitting them into a coherent story of what actually went wrong.\n\nNiall brings a depth of knowledge and is worth knowing as he is a best-selling author and what some would call \"the godfather of SRE\".\n\nRonak brings his own depth here as well. He used to run full-stack observability at AppDynamics/Splunk, so this isn't a new problem to either of them.\n\nThey've also built out a plethora of Cisco and Splunk integrations including Splunk Observability Cloud, AppDynamics, ThousandEyes, Webex, Splunk Cloud, and more.\n\nWant to see it? Head to ciroos.ai for a dedicated demo session."
- id: gg8aR1TDFr4
  title: "To Err Is Not Just Human: AI Observability with bitsIO"
  date: 2026-09-24
  duration: "4:46"
  description: "I caught up with Kalpana Krishnamurthi and Suman Gajavelly from bitsIO Inc. at .conf26 fresh off winning a Partner of the Year award for the fifth time!\n\nKalpana's take on the award stuck with me \"...the responsibility is higher now. Your expectations are higher. You have to deliver more than what you delivered.\" Five wins in, and they are not slowing down.\n\nI asked what's got bitsIO excited right now, and the answer was agentic observability. Kalpana quoted a phrase from the show that said \"To err is not just human\". You have to monitor agentic behavior the same way you'd monitor human behavior.\n\nSuman shared bitsIO's journey as one of only four partners who helped validate the new AI Tier which is a capability that brings Splunk Cloud's AI features to air-gapped on-prem environments. For customers who can't have agents reaching out to the internet, that's not a nice-to-have, it's a requirement. Customers working with bitsIO get a reference architecture, bill of materials, and sizing guidance to get there.\n\nCongrats to the team, and check them out at bitsioinc.com"
- id: unPYJvUU728
  title: "Dark Web Threat Intel in Splunk: 1.1M Sources with Dataminr"
  date: 2026-09-23
  duration: "7:24"
  description: "I had an opportunity to chat with Mo Hasan from Dataminr at .conf26 about their Splunk integration analyzing over 1.1 million public data sources including deep web, dark web, code repositories, hacker forums, sensors, you name it. Mo talks about three modules: \n\n 1️⃣ What is your relevant threat exposure to know what is coming your way\n\n 2️⃣ What is the business cost if you don't do anything and the threat is exploited\n\n 3️⃣ Exactly how to remediate the problem and the necessary steps\n\nThe part that stood out to me is their Splunk integration is a genuine out-of-the-box app. Download it from Splunkbase, grab an API key from Dataminr, check a few boxes, and you're done. In about 10 to 15 minutes, you will start to see Dataminr data in your Splunk environment. And, because it's CIM-compliant, correlation happens automatically!\n\nIf you want to see it firsthand, take Mo up on his offer for a free month-long trial."
- id: _ypZDCCVTdw
  title: "The Spicy Truth About AI's Resources"
  date: 2026-09-22
  duration: "3:43"
  description: "Ran into Annie Hardy at Cisco Live Amsterdam, and her talk on the future of the internet was, in her own words, \"spicy.\"\n\nThe controversial part: AI's resource constraints aren't really about chips. Humanity has always fought over natural resources including water, land, and then rare earth minerals like lithium and cobalt for batteries. Now it's shifting again. One data center reportedly consumed 29% of an entire town's water supply. California already trades water futures. And the next constraint is nuclear. AI is scaling faster than green energy infrastructure can keep up, which means small modular reactors, which means radioactive materials, which are concentrated in some of the most geopolitically contested regions on Earth.\n\nFollow Annie for more as she posts on AI, exponential tech, and \"the humanity behind AI.\"  https://www.linkedin.com/in/anniehardy/"
- id: 6jdPRtO57qU
  title: "From Cisco Distinguished Engineer to Observability Partner: Netnology"
  date: 2026-09-22
  duration: "2:55"
  description: "I caught up with Salman Asadullah from Netnology at .conf26, and his path here says a lot about where this industry is heading.\n\nHe was a Distinguished Engineer at Cisco working on full-stack observability (AppDynamics, ThousandEyes) before leaving in 2017 to build Netnology. When the Splunk acquisition happened, his team didn't wait around. They got certified on Splunk Observability, and built out migration services to help customers move from AppD to Splunk o11y Cloud. They are leveraging deep product history, real integration experience across the ecosystem, and moving fast to turn a \"better together\" story into an actual practice.\n\nIt's always great to see Salman. He is a pillar of the larger community and always willing to help build up others!\n\nCheck out Netnology at netnology.io"
- id: f5VTfkg_vFo
  title: "Splunk  .conf26 - Splunk Reimagined"
  date: 2026-09-19
  duration: "1:10"
  description: "\"Splunk Reimagined\" was a prevalent theme of .conf26, and big part of that story is data strategy. With Cisco Data Fabric powered by the Splunk Platform, the pitch isn't \"move all your data into one place\" anymore. Instead, it's all about making data usable wherever it is. Federated search, a Machine Data Lake that keeps cost sane at massive scale, and AI experiences to get the right data to the right place to drive the right analytics are just the start. That shift alone changes how organizations plan their next five years of infrastructure.\n\nIt was also great getting time with partners this week. They're in the trenches turning these announcements into real customer outcomes. That's always the best part of .conf for me.\n\nAdd in a customer cutting incident response time from 20 minutes to 39 seconds, a coffee maker triggered by an AI agent on the keynote stage (yes, really), and a closing night set from Ludacris that had the whole crowd moving, and you've got a good week.\n\nEvery year this community reminds me why I love doing this. See you in Chicago for .conf27."
